<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Андрей лох</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0033 0%, #0d001a 50%, #1a0033 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }
        
        h1 {
            font-size: clamp(3rem, 15vw, 15rem);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: linear-gradient(90deg, #ff006e, #ffbe0b, #fb5607, #ff006e);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite, pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 0, 110, 0.5));
            padding: 20px;
            user-select: none;
        }
        
        @keyframes shine {
            to { background-position: 300% center; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <h1>Коля лох</h1>
</body>
</html>
